[project]
name = "result-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.8.22",
    "matplotlib>=3.7.5",
    "mypy>=1.14.1",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "pydantic>=2.10.6",
    "results>=1.4.1769595341",
    "returns>=0.21.0",
    "ruff>=0.16.8",
    "scipy>=1.18.1",
]

[tool.marimo.runtime]
pythonpath = ["."]
watcher_on_save = "autorun"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.marimo.language_servers.pylsp]
enabled = true
enable_mypy = true
enable_ruff = true

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["^dist/"]

[[tool.mypy.overrides]]
module = "notebook.*"
disable_error_code = ["no-redef", "no-untyped-def", "no-untyped-call"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# marimo ends every cell with `return` and writes it back on save
"notebook/*" = ["PLR1711"]

[dependency-groups]
dev = [
    "pandas-stubs>=2.0.2.230605",
    "pylsp-mypy>=0.8.0",
    "pytest>=9.1.1",
    "python-lsp-server>=1.15.0",
    "scipy-stubs>=1.18.1.0",
]
